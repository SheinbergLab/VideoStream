name: Release for macOS

on:
  push:
    tags:
      - '*'

jobs:

  release-macos:
    # Apple Silicon runner; build on not-the-latest for modest dep versions.
    runs-on: macos-14

    permissions:
      contents: write

    steps:

      - name: Install build dependencies
        run: |
          brew update
          # tcl-tk@9 is bundle-friendly (non-zipfs libtcl + on-disk stdlib);
          # dylibbundler relocates dylibs into the .app.
          brew install cmake dylibbundler opencv tcl-tk@9 lz4 jansson jq wget

      - name: Check out our code for the current tag
        uses: actions/checkout@v4
        with:
          # macOS uses brew Tcl/jansson, FetchContent uSockets, vendored sqlite —
          # no git submodules needed (deps/tcl is the Linux path).
          submodules: false

      - name: Install dlsh (libdg + df.h) from the dlsh release
        run: |
          DLSH_VERSION=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/SheinbergLab/dlsh/releases/latest | jq -r '.tag_name')
          echo "Using dlsh version: $DLSH_VERSION"
          wget -q "https://github.com/SheinbergLab/dlsh/releases/download/${DLSH_VERSION}/dlsh-${DLSH_VERSION}-Darwin-arm64-signed.pkg"
          sudo installer -pkg "dlsh-${DLSH_VERSION}-Darwin-arm64-signed.pkg" -target /

      - name: Set up a keychain for Apple code signing
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APP_CERTIFICATE_BASE64: ${{ secrets.APPLE_APP_CERTIFICATE_BASE64 }}
          INSTALLER_CERTIFICATE_BASE64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_BASE64 }}
        run: |
          APP_CERT="$RUNNER_TEMP/developerID_application.p12"
          INSTALLER_CERT="$RUNNER_TEMP/developerID_installer.p12"
          echo -n "$APP_CERTIFICATE_BASE64" | base64 --decode -o "$APP_CERT"
          echo -n "$INSTALLER_CERTIFICATE_BASE64" | base64 --decode -o "$INSTALLER_CERT"

          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # Both the Application and Installer certs were exported with the same password.
          security import "$APP_CERT"       -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security import "$INSTALLER_CERT" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"

          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          security find-identity -p basic -v

      - name: Build, sign (.app), package (.pkg), sign + notarize the pkg
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_CERT_ID: ${{ secrets.APPLE_APP_CERT_ID }}
          INSTALLER_CERT_ID: ${{ secrets.APPLE_INSTALLER_CERT_ID }}
        run: |
          set -euo pipefail
          # Configure the self-contained bundle; the build's install step signs the
          # .app (Developer ID Application + hardened runtime + entitlements + timestamp).
          cmake -B build \
            -D PROJECT_VERSION=${{ github.ref_name }} \
            -D MACOS_APP_BUNDLE=ON \
            -D MACOS_CODESIGN_IDENTITY="$APP_CERT_ID"
          cmake --build build -j

          # cpack -> unsigned .pkg (containing the signed .app, installs to /Applications,
          # postinstall drops the /usr/local/bin/videostream CLI launcher).
          cpack --config build/CPackConfig.cmake
          PKG="$(find . -maxdepth 2 -name 'videostream-*-Darwin.pkg' ! -name '*-signed.pkg' | head -1)"
          echo "Built pkg: $PKG"

          # Sign the pkg wrapper with the Developer ID Installer cert.
          SIGNED="videostream-${{ github.ref_name }}-Darwin-$(uname -m)-signed.pkg"
          productsign --sign "$INSTALLER_CERT_ID" "$PKG" "$SIGNED"

          # Notarize the signed pkg and staple the ticket.
          xcrun notarytool store-credentials --apple-id "$APPLE_ID" --team-id "$TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" videostream-signing
          xcrun notarytool submit "$SIGNED" --keychain-profile videostream-signing --wait
          xcrun stapler staple "$SIGNED"

      - name: Create a GitHub release for the current tag and package
        uses: ncipollo/release-action@v1
        with:
          artifacts: "./*-signed.pkg"
          body: VideoStream ${{ github.ref_name }} (macOS, Apple Silicon)
          generateReleaseNotes: true
          allowUpdates: true

  check-macos:
    # Verify the released pkg installs + runs on a clean runner with no brew deps
    # and no dlsh install — proving the .app is self-contained.
    needs: release-macos
    runs-on: macos-15
    steps:
      - name: Download and install the released pkg
        run: |
          PKG="videostream-${{ github.ref_name }}-Darwin-$(uname -m)-signed.pkg"
          wget -q "${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/${PKG}"
          sudo installer -pkg "$PKG" -target /

      - name: Sanity-check the installed app + CLI launcher
        run: |
          # Gatekeeper assessment of the notarized, stapled app.
          spctl -a -vvv -t exec /Applications/VideoStream.app || true
          # The postinstall CLI launcher should be on PATH and runnable.
          /usr/local/bin/videostream --help
